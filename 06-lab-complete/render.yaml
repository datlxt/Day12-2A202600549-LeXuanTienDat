services:
  - type: web
    name: travel-agent-vn
    runtime: docker
    rootDir: 06-lab-complete
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: Tro Ly Du Lich Viet Nam
      - key: APP_VERSION
        value: "1.0.0"
      - key: AGENT_API_KEY
        value: demo-key-123
      - key: DAILY_BUDGET_USD
        value: "5.0"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
